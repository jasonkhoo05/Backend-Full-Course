# Dockerfile is an instruction for a singular docker container
# When we have an application that uses numerous containers/environments, we need a configuration sheet (docker-compose-yaml) for our conglomerate of containers
version: '3'
services:
  app:
    # This will find Dockerfile in the current directory and use it as instruction to build the container
    build: .
    container_name: todo-app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/todoapp
      - JWT_SECRET=your_jwt_secret_string
      - NODE_ENV=development
      - PORT=5000
    ports:
      # the first 5000 is the external port, the second 5000 is the internal port. We are matching them up
      - "5000:5000"
    depends_on:
      - db
    # volumes stores the history of our server so that everytime we bootup our container, it won't be a blank state
    volumes:
      - .:/app
  
  db:
    image: postgres:13-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todoapp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: